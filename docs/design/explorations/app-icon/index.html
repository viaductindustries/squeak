<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Squeak app icon options</title>
<style>
  :root { color-scheme: light dark; font: 14px -apple-system, system-ui, sans-serif; }
  body { margin: 0; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 28px; }
  .opt h2 { font-size: 15px; font-weight: 600; margin: 12px 0 4px; }
  .opt p { margin: 0 0 12px; opacity: .7; line-height: 1.4; }
  .big svg { width: 100%; max-width: 220px; display: block; margin: 0 auto; }
  .sizes { display: flex; flex-direction: column; gap: 0; border-radius: 10px; overflow: hidden; }
  .sizes div { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px; }
  .light { background: #ECEEF2; } .dark { background: #1E1F22; }
  .sizes svg:nth-child(1) { width: 48px; } .sizes svg:nth-child(2) { width: 32px; } .sizes svg:nth-child(3) { width: 16px; }
</style></head>
<body>
<div class="grid" id="grid"></div>
<script>
const SQ = (id, a, b) => `
  <defs><linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
  <filter id="sh${id}" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.22"/></filter></defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg${id})"/>`;

const ICONS = {
  A: { name: "Mouse mouse", caption: "A computer mouse with ears and a cable tail. The pun in the name.", svg: `
    ${SQ("A", "#9BD7FF", "#3F86E8")}
    <defs><linearGradient id="bodyA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient></defs>
    <g filter="url(#shA)">
      <path d="M512 760 C512 830 600 850 660 815 C720 780 740 740 790 750" fill="none" stroke="#F4F7FB" stroke-width="22" stroke-linecap="round"/>
      <circle cx="392" cy="352" r="86" fill="#E3E9F1"/><circle cx="392" cy="352" r="52" fill="#FFA3BA"/>
      <circle cx="632" cy="352" r="86" fill="#E3E9F1"/><circle cx="632" cy="352" r="52" fill="#FFA3BA"/>
      <rect x="362" y="320" width="300" height="450" rx="150" fill="url(#bodyA)"/>
    </g>
    <path d="M512 322 V470" stroke="#B8C3D1" stroke-width="10" stroke-linecap="round"/>
    <rect x="497" y="380" width="30" height="62" rx="15" fill="#B8C3D1"/>` },

  B: { name: "Side buttons", caption: "A graphite mouse in profile with its side buttons lit. About what the app controls.", svg: `
    ${SQ("B", "#3A3F47", "#15171B")}
    <defs><linearGradient id="bodyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F4F7"/><stop offset="1" stop-color="#B9C0CA"/></linearGradient>
    <filter id="glowB" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs>
    <g filter="url(#shB)"><path d="M250 680 C250 470 400 360 560 360 C720 360 790 470 790 610 L790 640 Q790 680 750 680 Z" fill="url(#bodyB)"/></g>
    <path d="M250 680 H790" stroke="#8D96A3" stroke-width="10"/>
    <g fill="#FF9F2E" filter="url(#glowB)" opacity="0.9"><rect x="372" y="520" width="118" height="46" rx="23"/><rect x="510" y="520" width="118" height="46" rx="23"/></g>
    <g fill="#FFB14E"><rect x="372" y="520" width="118" height="46" rx="23"/><rect x="510" y="520" width="118" height="46" rx="23"/></g>` },

  C: { name: "Squeak", caption: "A mouse giving off sound waves. Playful, and reads at small sizes.", svg: `
    ${SQ("C", "#FFE07A", "#FF9D3D")}
    <defs><linearGradient id="bodyC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1E6DA"/></linearGradient></defs>
    <g transform="rotate(-16 440 590)" filter="url(#shC)">
      <rect x="310" y="390" width="270" height="410" rx="135" fill="url(#bodyC)"/>
      <path d="M445 392 V520" stroke="#E2CDB6" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round">
      <path d="M592 352 A90 90 0 0 1 668 438"/>
      <path d="M606 266 A180 180 0 0 1 756 424"/>
      <path d="M620 180 A270 270 0 0 1 844 410" opacity="0.9"/>
    </g>` },

  D: { name: "Remap", caption: "A button turning into a key. Says what the app does, more like a utility.", svg: `
    ${SQ("D", "#B79CFF", "#6A3FE0")}
    <g filter="url(#shD)">
      <rect x="220" y="330" width="230" height="350" rx="115" fill="none" stroke="#FFFFFF" stroke-width="34"/>
      <path d="M335 335 V450" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
      <rect x="580" y="420" width="230" height="230" rx="48" fill="#FFFFFF"/>
      <text x="695" y="580" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Helvetica" font-weight="600" font-size="150" fill="#6A3FE0">⌘</text>
    </g>
    <path d="M400 270 C520 190 650 230 690 360" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
    <path d="M640 330 L692 386 L738 324" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>` },

  E: { name: "Cable S", caption: "The mouse's cable draws an S. A monogram, the most abstract.", svg: `
    ${SQ("E", "#5EE3B0", "#0E9F6E")}
    <defs><linearGradient id="bodyE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDEFE7"/></linearGradient></defs>
    <g filter="url(#shE)">
      <path d="M632 340 C632 270 560 250 500 250 C410 250 372 300 372 360 C372 470 652 470 652 620 C652 720 580 772 490 772 C420 772 372 740 360 690" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
      <rect x="560" y="300" width="144" height="210" rx="72" fill="url(#bodyE)"/>
    </g>
    <path d="M632 302 V370" stroke="#A9CFC0" stroke-width="8" stroke-linecap="round"/>` },
};

// Each copy needs its own gradient ids, so render with unique suffixes.
function render(k) {
  const s = Math.random().toString(36).slice(2, 7);
  const body = ICONS[k].svg.replace(/id="([^"]+)"/g, `id="$1${s}"`).replace(/url\(#([^)]+)\)/g, `url(#$1${s})`);
  return `<svg viewBox="100 100 824 824" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
document.getElementById('grid').innerHTML = Object.keys(ICONS).map(k => `
  <section class="opt">
    <div class="big">${render(k)}</div>
    <h2>${k}. ${ICONS[k].name}</h2><p>${ICONS[k].caption}</p>
    <div class="sizes"><div class="light">${render(k)}${render(k)}${render(k)}</div><div class="dark">${render(k)}${render(k)}${render(k)}</div></div>
  </section>`).join('');
</script></body></html>
